[build]
  command = "node scripts/write-config.js && node scripts/generate-sitemap.js"
  publish = "."

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/lumina-loja-publica-home-secoes-v2.zip"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
